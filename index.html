<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Romains et Barbares — carte superposée</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #222;
    }

    .carte {
      position: relative;
      width: min(100vw, calc(100vh * 1448 / 1086));
      aspect-ratio: 1448 / 1086;
      margin: 0 auto;
    }

    .couche {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .fond {
      object-fit: fill;
    }
  </style>
</head>
<body>
  <main class="carte" aria-label="Carte superposant le fond, les routes et les lieux">
    <object class="couche" data="carte.svg" type="image/svg+xml" aria-label="Carte avec routes, nœuds, capitales et centres"></object>
  </main>
</body>
</html>
